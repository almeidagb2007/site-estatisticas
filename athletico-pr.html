<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athletico-PR · Elenco 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F2F0EE; --surface:#FFFFFF; --surface-2:#F7F5F3; --ink:#1A1414; --muted:#6B6260; --line:#E3DEDA;
  --accent:#C8102E; --accent-soft:#FBE6E9; --accent-ink:#A30D25;
  --bad:#C8102E; --bad-soft:#FBE6E9; --bad-ink:#A30D25;
  --band-bg:linear-gradient(135deg,var(--band-a),var(--band-b)); --band-bg-sm:var(--band-bg);
  --gold:#8A5A00; --gold-soft:#FBF0D9;
  --blue:#2D5683; --blue-soft:#E3ECF6;
  --band-a:#C8102E; --band-b:#1A1414; --on-band:#FFFFFF;
  --dim:.55;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#140F0F; --surface:#1C1616; --surface-2:#231C1C; --ink:#F3EEEC; --muted:#A99F9C; --line:#352B2B;
    --accent:#E8343F; --accent-soft:#3A1619; --accent-ink:#FF8A8F;
    --bad:#E8343F; --bad-soft:#3A1619; --bad-ink:#FF8A8F;
    --gold:#E7B65A; --gold-soft:#36290F;
    --blue:#8DB4E2; --blue-soft:#18273A;
    --band-a:#C8102E; --band-b:#0E0A0A; --on-band:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#140F0F; --surface:#1C1616; --surface-2:#231C1C; --ink:#F3EEEC; --muted:#A99F9C; --line:#352B2B;
  --accent:#E8343F; --accent-soft:#3A1619; --accent-ink:#FF8A8F;
  --bad:#E8343F; --bad-soft:#3A1619; --bad-ink:#FF8A8F;
  --gold:#E7B65A; --gold-soft:#36290F;
  --blue:#8DB4E2; --blue-soft:#18273A;
  --band-a:#C8102E; --band-b:#0E0A0A; --on-band:#FFFFFF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.display{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Faixa com as cores do clube */
.band{background:var(--band-bg);color:var(--on-band);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.05) 100%)}
.band .wrap{position:relative;z-index:1;padding-top:40px;padding-bottom:32px}
.team{font-size:clamp(64px,13vw,150px);line-height:.82;font-weight:900;letter-spacing:-.01em;margin:0}
.season{font-size:17px;margin:40px 0 0;opacity:.92;max-width:62ch}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:30px}
.fact{display:flex;flex-direction:column}
.fact b{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:34px;line-height:1;font-weight:800}
.fact span{font-size:13px;opacity:.85}

.next{margin:-1px 0 0;background:var(--surface);border-bottom:1px solid var(--line)}
.next .wrap{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding-top:14px;padding-bottom:14px}
.next strong{font-weight:700}
.next .when{color:var(--muted)}

/* Controles */
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}
.controls h2{margin:0;font-size:30px;font-weight:800;line-height:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}

/* Tabela */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:820px}
thead th{text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th:first-child,thead th:last-child{text-align:left}
th.col-player{position:sticky;left:0;background:var(--surface);z-index:2}
tr.grp th{text-align:left;padding:18px 16px 8px;font-family:"Big Shoulders Display",Impact,sans-serif;font-size:20px;font-weight:800;color:var(--accent);background:var(--surface-2);border-bottom:1px solid var(--line);position:sticky;left:0}
tbody tr.p{border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
tbody tr.p:hover{background:var(--surface-2)}
tbody tr.p.out .num,tbody tr.p.out .pl{opacity:var(--dim)}
td{padding:11px 10px;vertical-align:top}
td.pl{position:sticky;left:0;background:inherit;background-color:var(--surface);min-width:210px;padding-left:16px}
tbody tr.p:hover td.pl{background-color:var(--surface-2)}
.pl button{all:unset;cursor:pointer;display:block}
.pl button:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.pl .nm{font-weight:700}
.pl .sub{color:var(--muted);font-size:13.5px}
.num{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.num .big{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:23px;font-weight:800;line-height:1}
.num .cmp{font-size:13px;color:var(--muted);margin-left:3px}
.num .dash{color:var(--muted)}
.cards{text-align:center;font-size:13.5px;white-space:nowrap}
.cards .red{color:var(--bad-ink);font-weight:600}
td.tags{min-width:250px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;line-height:1.35;white-space:nowrap}
.chip.alert{background:var(--bad-soft);color:var(--bad-ink)}
.chip.mark{background:var(--gold-soft);color:var(--gold)}
.chip.info{background:var(--blue-soft);color:var(--blue)}

/* Líderes */
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:22px 0 10px}
.ld{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ld h3{margin:0 0 8px;font-size:15px}
.ld ol{margin:0;padding:0;list-style:none}
.ld li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.ld li:last-child{border-bottom:0}
.ld li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.coach{margin:18px 0 0;font-size:14.5px;color:var(--muted)}
.coach b{color:var(--ink)}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0 0;font-size:13px;color:var(--muted);align-items:center}
footer{margin:34px 0 40px;font-size:13px;color:var(--muted);max-width:80ch}
footer p{margin:0 0 8px}

/* Painel do jogador */
.scrim{position:fixed;inset:0;background:rgba(10,6,6,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dr-head{position:relative;background:var(--band-bg-sm);color:var(--on-band);padding:22px 22px 18px}
.dr-head::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.75),rgba(0,0,0,.3))}
.dr-head>*{position:relative;z-index:1}
.dr-num{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:64px;font-weight:900;line-height:.85}
.dr-name{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:36px;font-weight:800;line-height:1;margin:6px 0 4px}
.dr-line{font-size:14px;opacity:.9}
.close{position:absolute;top:14px;right:14px;z-index:2;border:0;background:rgba(255,255,255,.16);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
.dr-body{overflow-y:auto;padding:4px 22px 28px;flex:1}
.dr-body h4{font-size:15px;margin:22px 0 10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kv span{display:block;font-size:12.5px;color:var(--muted)}
.kv b{font-size:16px}
.kv b.big{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:28px;font-weight:800;line-height:1.05}
.notes{margin:0;padding:0;list-style:none}
.notes li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.notes li:last-child{border-bottom:0}
.notes .src{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.mini{width:100%;border-collapse:collapse;min-width:0;font-size:14px}
.mini th,.mini td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini th{font-size:12.5px;color:var(--muted);font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:Archivo,sans-serif;fill:var(--muted);font-size:11px}
.chart .lbl{fill:var(--ink);font-weight:700}
.peak{font-size:13px;color:var(--muted);margin:6px 0 0}
.career{margin:0;padding:0 0 0 16px;list-style:none;border-left:2px solid var(--line)}
.career li{position:relative;padding:0 0 12px 12px;font-size:14.5px}
.career li::before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.career li.me::before{background:var(--accent);border-color:var(--accent)}
.career .yr{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:8px}
.career .fee{color:var(--muted);font-size:13px}
.next a{color:var(--accent-ink);font-weight:700;text-decoration:none;border-bottom:2px solid currentColor;margin-left:auto}
.next a:hover{color:var(--accent)}
.news{margin:34px 0 0}
.news h2{font-size:30px;font-weight:800;margin:0 0 12px;line-height:1}
.news ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.news li{display:grid;grid-template-columns:76px 1fr;gap:4px 14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.news li:last-child{border-bottom:0}
.news time{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:19px;color:var(--accent);line-height:1.3}
.news p{margin:0;max-width:72ch}
.news .src{grid-column:2;font-size:13.5px;color:var(--muted)}
.news .src a{color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.news .src a:hover{color:var(--accent)}
.back{display:inline-block;color:var(--on-band);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:18px;opacity:.9;border-bottom:1px solid rgba(255,255,255,.5)}
.match{font-size:clamp(44px,8.5vw,96px);line-height:.88;font-weight:900;margin:0}
.match .x{opacity:.6;font-weight:600}
.match+.season{margin-top:40px}
.sec{margin:34px 0 0}
.sec>h2{font-size:30px;font-weight:800;margin:0 0 14px;line-height:1}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{margin:0 0 4px;font-size:17px}
.card .meta{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.big3{display:flex;gap:10px 26px;flex-wrap:wrap;margin:6px 0 12px}
.big3 div{display:flex;flex-direction:column}
.big3 b{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:40px;font-weight:800;line-height:1}
.big3 span{font-size:13px;color:var(--muted)}
.bul{margin:0;padding:0 0 0 18px}
.bul li{margin:0 0 6px}
.games{list-style:none;margin:0;padding:0}
.games li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.games li:last-child{border-bottom:0}
.games .d{font-weight:700;margin-right:6px}
.games .g{display:block;color:var(--muted);font-size:13.5px;padding-left:18px}
.games .c{color:var(--muted);font-size:13px}
.form{display:flex;gap:5px;margin:0 0 10px}
.form span{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px}
.form .V{background:#1E7A46;color:#fff}.form .E{background:var(--line);color:var(--ink)}.form .D{background:var(--bad);color:#fff}
.src-note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.wait{border:2px dashed var(--line);border-radius:14px;padding:18px 20px;color:var(--muted);margin-bottom:14px}
.wait b{color:var(--ink)}
[hidden]{display:none!important}
.status{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.status.err{background:var(--bad);color:#fff}
@media (max-width:640px){
  .next a{margin-left:0}
  .news li{grid-template-columns:1fr}
  .news .src{grid-column:1}
  .band .wrap{padding-top:28px}
  .fact b{font-size:28px}
  .controls h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="view-elenco">
<header class="band">
  <div class="wrap">
    <a class="back" href="index.html">← Todos os clubes</a>
    <h1 class="team display" id="team">Athletico-PR</h1>
    <p class="season" id="season"></p>
    <div class="facts" id="facts"></div>
  </div>
</header>

<div class="next" id="next" hidden>
  <div class="wrap">
    <strong id="nx-title">Próximo jogo</strong>
    <span class="when" id="nx-when"></span>
    <a href="#pre-jogo">Abrir pré-jogo</a>
  </div>
</div>

<main class="wrap">
  <div class="controls">
    <h2 class="display" id="elenco">Elenco</h2>
    <div class="seg" id="seg" role="group" aria-label="Competição"></div>
  </div>
  <p class="hint" id="hint"></p>

  <div class="tbl-wrap">
    <table id="tbl">
      <thead>
        <tr>
          <th class="col-player" scope="col">Jogador</th>
          <th scope="col" id="h-jogos">Jogos</th>
          <th scope="col">Gols</th>
          <th scope="col">Assistências</th>
          <th scope="col">Cartões</th>
          <th scope="col">Destaques</th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="legend">
    <span class="chip alert">Alerta</span><span>desfalque, pendurado, cartões</span>
    <span class="chip mark">Marca</span><span>números e recordes</span>
    <span class="chip info">Contexto</span><span>seleção, mercado, bastidor</span>
  </div>

  <div class="leaders" id="leaders"></div>
  <p class="coach" id="coach"></p>

  <section class="news" aria-labelledby="news-h">
    <h2 class="display" id="news-h">Últimas do clube</h2>
    <ul id="news"></ul>
  </section>

  <footer id="rodape"></footer>
</main>
</div>

<div id="view-jogo" hidden>
  <header class="band">
    <div class="wrap">
      <a class="back" href="#">Voltar ao elenco</a>
      <h1 class="match display" id="mj-title"></h1>
      <p class="season" id="mj-when"></p>
      <div class="facts" id="mj-facts"></div>
    </div>
  </header>
  <main class="wrap" id="mj-body"></main>
</div>

<div class="status" id="status" role="status">Carregando dados…</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-name" aria-hidden="true">
  <div class="dr-head">
    <button class="close" id="close" aria-label="Fechar perfil">×</button>
    <div class="dr-num" id="dr-num"></div>
    <div class="dr-name" id="dr-name"></div>
    <div class="dr-line" id="dr-line"></div>
  </div>
  <div class="dr-body" id="dr-body"></div>
</aside>

<script>
// Números: [jogos, gols, assistências, amarelos, 2º amarelo, vermelho direto, entradas do banco, minutos]
const CLUBE_ID="athletico-pr";
let P=[],GROUPS=[],HERO={},NEWS=[],CLUB=null,MATCH=null,COMP={all:"Temporada"},COMPS=[],F=null;
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const fmt=n=>n.toLocaleString("pt-BR");
const mvTxt=v=>v>=1?"€"+String(v).replace(".",",")+" mi":"€"+Math.round(v*1000)+" mil";
const plural=(n,s,p)=>n===1?s:p;

function numCell(v,hideZero){
  const td=el("td","num");
  if(hideZero){td.appendChild(el("span","dash","—"));return td}
  td.appendChild(el("span","big",v));
  return td;
}
function cardsCell(c){
  const td=el("td","cards");
  const [ , , ,y,y2,r]=c;
  const lines=[];
  if(y)lines.push([y+" "+plural(y,"amarelo","amarelos"),""]);
  if(r)lines.push([r+" "+plural(r,"vermelho direto","vermelhos diretos"),"red"]);
  if(y2)lines.push([y2+" "+plural(y2,"vermelho, por dois amarelos","vermelhos, por dois amarelos"),"red"]);
  if(!lines.length){td.appendChild(el("span","dash","—"));return td}
  lines.forEach(([t,c])=>{const d=el("div",c,t);td.appendChild(d)});
  return td;
}

function renderHero(){
  const h=HERO[F];$("#season").textContent=h.t;
  const fx=$("#facts");fx.textContent="";
  h.f.forEach(([b,t])=>{const d=el("div","fact");d.appendChild(el("b",null,b));d.appendChild(el("span",null,t));fx.appendChild(d)});
}
function renderNews(){
  const ul=$("#news");ul.textContent="";
  NEWS.forEach(([d,t,src,url])=>{const li=el("li");li.appendChild(el("time",null,d));li.appendChild(el("p",null,t));
    const sp=el("span","src");
    if(url&&/^https:\/\//.test(url)){const a=el("a",null,"Ler matéria: "+src);a.href=url;a.target="_blank";a.rel="noopener noreferrer";sp.appendChild(a)}
    else sp.textContent="Fonte: "+src;
    li.appendChild(sp);ul.appendChild(li)});
}
function buildSeg(){
  const seg=$("#seg");seg.textContent="";
  [{id:"all",nome:"Temporada"},...COMPS].forEach(c=>{
    const b=el("button",null,c.nome);b.type="button";b.dataset.f=c.id;
    b.addEventListener("click",()=>{F=c.id;render()});seg.appendChild(b);
  });
}
function render(){
  renderHero();
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===F));
  $("#h-jogos").textContent="Jogos";
  const cur=COMPS.find(c=>c.id===F);
  $("#hint").textContent=F==="all"
    ?"Números de todas as competições de "+CLUB.temporada+". Toque num jogador para ver carreira, valor de mercado e curiosidades."
    :"Números só "+(cur?cur.de:COMP[F])+". Toque num jogador para ver os números de cada competição, carreira, valor de mercado e curiosidades.";
  const tb=$("#tb");tb.textContent="";
  GROUPS.forEach((gname,gi)=>{
    const ps=P.filter(p=>p.g===gi);if(!ps.length)return;
    const gr=el("tr","grp");const th=el("th",null,gname);th.colSpan=6;th.scope="colgroup";gr.appendChild(th);tb.appendChild(gr);
    ps.forEach(p=>{
      const c=p.s[F];
      const tr=el("tr","p"+(p.out?" out":""));tr.dataset.id=p.id;
      const pl=el("td","pl");const b=el("button");b.type="button";b.setAttribute("aria-label","Abrir perfil de "+p.name);
      b.appendChild(el("div","nm",p.n+". "+p.name+" ("+p.age+")"));

function chart(p,w){
  const pts=p.mvh;const H=150,pl=30,pr=14,pt=22,pb=24;
  const ns="http://www.w3.org/2000/svg";const s=document.createElementNS(ns,"svg");
  s.setAttribute("viewBox","0 0 "+w+" "+H);s.setAttribute("class","chart");s.setAttribute("role","img");
  s.setAttribute("aria-label","Valor de mercado de "+p.name+" de "+pts[0][0]+" a "+pts[pts.length-1][0]);
  const max=Math.max(...pts.map(x=>x[1]))*1.15||1;
  const xs=i=>pts.length===1?w/2:pl+i*(w-pl-pr)/(pts.length-1);
  const ys=v=>pt+(H-pt-pb)*(1-v/max);
  const mk=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);s.appendChild(e);return e};
  mk("line",{x1:pl,x2:w-pr,y1:H-pb,y2:H-pb,stroke:"var(--line)"});
  if(pts.length>1){
    const d=pts.map((x,i)=>(i?"L":"M")+xs(i)+" "+ys(x[1])).join(" ");
    mk("path",{d:d+" L"+xs(pts.length-1)+" "+(H-pb)+" L"+xs(0)+" "+(H-pb)+" Z",fill:"var(--accent-soft)"});
    mk("path",{d,fill:"none",stroke:"var(--accent)","stroke-width":2.5,"stroke-linejoin":"round"});
  }
  pts.forEach((x,i)=>{
    mk("circle",{cx:xs(i),cy:ys(x[1]),r:3.5,fill:"var(--accent)"});
    const ty=mk("text",{x:xs(i),y:H-8,"text-anchor":"middle"});ty.textContent="’"+String(x[0]).slice(2);
    const tv=mk("text",{x:xs(i),y:ys(x[1])-8,"text-anchor":"middle",class:i===pts.length-1?"lbl":""});tv.textContent=String(x[1]).replace(".",",");
  });
  return s;
}

/* Cópia local: garante a página cheia mesmo onde a base não responde */
function localDb(S){
  const snap=path=>{const d=S[path];return{id:path.split("/").pop(),exists:!!d,data:()=>d?JSON.parse(JSON.stringify(d)):undefined}};
  const q=(col,filters,ord)=>({where(f,o,v){return q(col,[...filters,[f,v]],ord)},orderBy(f,dir){return q(col,filters,[f,dir])},limit(){return this},
    async get(){const n=col.split("/").length+1;let docs=Object.keys(S).filter(k=>k.startsWith(col+"/")&&k.split("/").length===n).map(snap).filter(d=>filters.every(([f,v])=>d.data()[f]===v));
      if(ord)docs.sort((a,b)=>{const x=a.data()[ord[0]],y=b.data()[ord[0]];return(x>y?1:x<y?-1:0)*(ord[1]==="desc"?-1:1)});return{docs,size:docs.length,empty:!docs.length}}});
  return{doc:p=>({get:async()=>snap(p)}),collection:c=>q(c,[],null)};
}
